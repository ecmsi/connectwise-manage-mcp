<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
  <title>Deployment architecture on the shared MCP host</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="700" fill="#111827">Shared MCP host: one Caddy, one container per server, loopback in between</text>

  <!-- Clients -->
  <rect x="20" y="70" width="180" height="150" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="110" y="95" text-anchor="middle" font-weight="700" fill="#111827">MCP clients</text>
  <text x="110" y="120" text-anchor="middle">Claude Code</text>
  <text x="110" y="140" text-anchor="middle">Claude Desktop</text>
  <text x="110" y="160" text-anchor="middle">claude.ai connector</text>
  <text x="110" y="190" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#374151">Authorization: Bearer …</text>
  <text x="110" y="208" text-anchor="middle" font-size="12" fill="#374151">HTTPS, port 443</text>

  <!-- Host boundary -->
  <rect x="250" y="55" width="690" height="290" rx="8" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="265" y="78" font-size="13" fill="#6b7280">Ubuntu VM (mcp host)</text>

  <!-- Caddy -->
  <rect x="280" y="100" width="170" height="110" rx="6" fill="#eef4fb" stroke="#2563eb" stroke-width="2"/>
  <text x="365" y="125" text-anchor="middle" font-weight="700" fill="#1e3a8a">Caddy</text>
  <text x="365" y="147" text-anchor="middle" font-size="13">TLS termination</text>
  <text x="365" y="165" text-anchor="middle" font-size="13">/etc/caddy/sites/*.caddy</text>
  <text x="365" y="183" text-anchor="middle" font-size="12" fill="#374151">forwards only /mcp and /health</text>
  <text x="365" y="199" text-anchor="middle" font-size="12" fill="#374151">sets X-Forwarded-For</text>

  <!-- Containers -->
  <rect x="520" y="95" width="200" height="60" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="620" y="118" text-anchor="middle" font-size="13" fill="#374151">ncentral-mcp</text>
  <text x="620" y="138" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#374151">127.0.0.1:3100</text>

  <rect x="520" y="170" width="200" height="130" rx="6" fill="#eef4fb" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="193" text-anchor="middle" font-weight="700" fill="#1e3a8a">connectwise-mcp</text>
  <text x="620" y="213" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#374151">127.0.0.1:3101 → :8080</text>
  <text x="620" y="233" text-anchor="middle" font-size="12">bearer check · rate limit · audit log</text>
  <text x="620" y="251" text-anchor="middle" font-size="12">CW_WRITE_MODE=read-only</text>
  <text x="620" y="269" text-anchor="middle" font-size="12">64 of 90 tools registered</text>
  <text x="620" y="287" text-anchor="middle" font-size="12" fill="#374151">read-only root fs, no caps, .env (600)</text>

  <rect x="520" y="310" width="200" height="25" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="620" y="327" text-anchor="middle" font-size="12" fill="#6b7280">next server → 127.0.0.1:3102</text>

  <!-- ConnectWise -->
  <rect x="770" y="170" width="150" height="90" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="845" y="195" text-anchor="middle" font-weight="700" fill="#9a3412">ConnectWise</text>
  <text x="845" y="215" text-anchor="middle" font-size="13">Manage API</text>
  <text x="845" y="233" text-anchor="middle" font-size="12" fill="#374151">api-na.myconnectwise.net</text>
  <text x="845" y="250" text-anchor="middle" font-size="12" fill="#374151">dedicated API member</text>

  <!-- Arrows -->
  <line x1="200" y1="145" x2="278" y2="145" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="125" x2="518" y2="125" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="185" x2="518" y2="215" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="215" x2="768" y2="215" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="744" y="205" text-anchor="middle" font-size="11" fill="#555">HTTPS</text>
  <text x="484" y="230" text-anchor="middle" font-size="11" fill="#555">HTTP</text>
</svg>
