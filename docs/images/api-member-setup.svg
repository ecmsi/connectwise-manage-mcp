<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>ConnectWise API member setup flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1040" height="330" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="700" fill="#111827">ConnectWise API member setup</text>
  <text x="20" y="50" font-size="12" fill="#555">Company ID is the short name you log in with. Afterwards, run cw_test_connection from a client to prove all four values.</text>

  <!-- Step 1: security role -->
  <rect x="20" y="75" width="235" height="125" rx="6" fill="#eef4fb" stroke="#2563eb" stroke-width="2"/>
  <text x="137" y="100" text-anchor="middle" font-weight="700" fill="#1e3a8a">1. Security role</text>
  <text x="137" y="124" text-anchor="middle">System &gt; Security Roles</text>
  <text x="137" y="146" text-anchor="middle" fill="#444">New role: "MCP Read-Only"</text>
  <text x="137" y="166" text-anchor="middle" fill="#444" font-size="12">Inquire: All</text>
  <text x="137" y="184" text-anchor="middle" fill="#444" font-size="12">Add / Edit / Delete: None</text>

  <!-- Step 2: API member -->
  <rect x="275" y="75" width="235" height="125" rx="6" fill="#eef4fb" stroke="#2563eb" stroke-width="2"/>
  <text x="392" y="100" text-anchor="middle" font-weight="700" fill="#1e3a8a">2. API member</text>
  <text x="392" y="124" text-anchor="middle">System &gt; Members</text>
  <text x="392" y="146" text-anchor="middle">API Members tab &gt; +</text>
  <text x="392" y="166" text-anchor="middle" fill="#444" font-size="12">Role ID = role from step 1</text>
  <text x="392" y="184" text-anchor="middle" fill="#444" font-size="12">Level: Corporate</text>

  <!-- Step 3: API keys -->
  <rect x="530" y="75" width="235" height="125" rx="6" fill="#eef4fb" stroke="#2563eb" stroke-width="2"/>
  <text x="647" y="100" text-anchor="middle" font-weight="700" fill="#1e3a8a">3. API keys</text>
  <text x="647" y="124" text-anchor="middle">Member &gt; API Keys tab &gt; +</text>
  <text x="647" y="146" text-anchor="middle" fill="#444">Public key + private key</text>
  <text x="647" y="166" text-anchor="middle" fill="#b91c1c" font-size="12">Private key is shown once.</text>
  <text x="647" y="184" text-anchor="middle" fill="#b91c1c" font-size="12">Copy it into .env immediately.</text>

  <!-- Step 4: Client ID -->
  <rect x="785" y="75" width="235" height="125" rx="6" fill="#eef4fb" stroke="#2563eb" stroke-width="2"/>
  <text x="902" y="100" text-anchor="middle" font-weight="700" fill="#1e3a8a">4. Client ID</text>
  <text x="902" y="124" text-anchor="middle" font-size="12">developer.connectwise.com</text>
  <text x="902" y="146" text-anchor="middle">ClientID &gt; register integration</text>
  <text x="902" y="166" text-anchor="middle" fill="#444" font-size="12">Type: Private, Product: Manage</text>
  <text x="902" y="184" text-anchor="middle" fill="#444" font-size="12">One GUID per integration</text>

  <!-- arrows between steps -->
  <line x1="255" y1="137" x2="273" y2="137" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="137" x2="528" y2="137" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="765" y1="137" x2="783" y2="137" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: .env -->
  <rect x="275" y="240" width="490" height="70" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="520" y="263" text-anchor="middle" font-weight="700" fill="#111827">5. /opt/mcp/connectwise/.env  (mode 600)</text>
  <text x="520" y="283" text-anchor="middle" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12" fill="#374151">CW_MANAGE_COMPANY_ID   CW_MANAGE_PUBLIC_KEY</text>
  <text x="520" y="300" text-anchor="middle" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12" fill="#374151">CW_MANAGE_PRIVATE_KEY  CW_MANAGE_CLIENT_ID</text>

  <!-- arrows into .env -->
  <line x1="647" y1="200" x2="647" y2="238" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="902" y1="200" x2="902" y2="275" stroke="#555" stroke-width="2"/>
  <line x1="902" y1="275" x2="767" y2="275" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
