<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
  <title>ConnectWise API member setup flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>

  <!-- Step 1: security role -->
  <rect x="20" y="60" width="200" height="120" rx="6" fill="#eef4fb" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="88" text-anchor="middle" font-weight="700" fill="#1e3a8a">1. Security role</text>
  <text x="120" y="112" text-anchor="middle">System &gt; Security Roles</text>
  <text x="120" y="134" text-anchor="middle" fill="#444">"MCP Read-Only"</text>
  <text x="120" y="156" text-anchor="middle" fill="#444">Inquire = All, everything else = None</text>

  <!-- Step 2: API member -->
  <rect x="260" y="60" width="200" height="120" rx="6" fill="#eef4fb" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="88" text-anchor="middle" font-weight="700" fill="#1e3a8a">2. API member</text>
  <text x="360" y="112" text-anchor="middle">System &gt; Members</text>
  <text x="360" y="134" text-anchor="middle">API Members tab &gt; +</text>
  <text x="360" y="156" text-anchor="middle" fill="#444">Role ID = the role from step 1</text>

  <!-- Step 3: API keys -->
  <rect x="500" y="60" width="200" height="120" rx="6" fill="#eef4fb" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="88" text-anchor="middle" font-weight="700" fill="#1e3a8a">3. API keys</text>
  <text x="600" y="112" text-anchor="middle">Member &gt; API Keys tab &gt; +</text>
  <text x="600" y="134" text-anchor="middle" fill="#444">Public key + private key</text>
  <text x="600" y="156" text-anchor="middle" fill="#b91c1c">Private key is shown once</text>

  <!-- Step 4: Client ID -->
  <rect x="740" y="60" width="200" height="120" rx="6" fill="#eef4fb" stroke="#2563eb" stroke-width="2"/>
  <text x="840" y="88" text-anchor="middle" font-weight="700" fill="#1e3a8a">4. Client ID</text>
  <text x="840" y="112" text-anchor="middle">developer.connectwise.com</text>
  <text x="840" y="134" text-anchor="middle">ClientID &gt; register integration</text>
  <text x="840" y="156" text-anchor="middle" fill="#444">One GUID per integration</text>

  <!-- arrows between steps -->
  <line x1="220" y1="120" x2="258" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="120" x2="498" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="120" x2="738" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: .env -->
  <rect x="260" y="215" width="440" height="60" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="480" y="240" text-anchor="middle" font-weight="700" fill="#111827">5. /opt/mcp/connectwise/.env  (mode 600)</text>
  <text x="480" y="262" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#374151">CW_MANAGE_COMPANY_ID  CW_MANAGE_PUBLIC_KEY  CW_MANAGE_PRIVATE_KEY  CW_MANAGE_CLIENT_ID</text>

  <!-- arrows down into .env -->
  <line x1="600" y1="180" x2="600" y2="213" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="180" x2="840" y2="245" stroke="#555" stroke-width="2"/>
  <line x1="840" y1="245" x2="702" y2="245" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- caption -->
  <text x="20" y="30" font-size="16" font-weight="700" fill="#111827">ConnectWise API member setup</text>
  <text x="20" y="48" font-size="13" fill="#555">The company ID is the short name you log in with. Then run cw_test_connection from a client to prove all four values.</text>
</svg>
