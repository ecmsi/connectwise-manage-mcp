# ConnectWise Manage MCP server on the centralised MCP host.
#
# One compose project per MCP server, each published on its own loopback
# port, with the host's shared Caddy terminating TLS in front of them all.
# This server is 127.0.0.1:3101 (N-central is 3100). See docs/DEPLOYMENT.md.
#
# Everything secret lives in .env (chmod 600), loaded with env_file. Nothing
# here holds a credential. Run from the directory that holds this file and
# .env, for example /opt/mcp/connectwise.
services:
  connectwise-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: connectwise-manage-mcp:local
    container_name: connectwise-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the container the listener binds every interface so the port
      # mapping can reach it; the left side of `ports` keeps it on loopback.
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8080"
      AUTH_MODE: env
      # Caddy sets X-Forwarded-For; without this every request looks like
      # 172.x from the bridge and the rate limiter has one bucket.
      MCP_TRUST_PROXY: "1"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3101:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
